<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova — multi-agent assistant</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235B5BD6'/%3E%3Ctext x='50%25' y='62%25' font-family='Inter,system-ui' font-size='38' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f7f7fb;
            --surface: #ffffff;
            --surface-variant: #eeeef6;
            --primary: #5b5bd6;
            --on-primary: #ffffff;
            --text: #1a1a24;
            --muted: #6b6b80;
            --border: #e5e5ef;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }
        .phone {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.08);
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        header .title h1 { font-size: 18px; margin: 0; font-weight: 600; }
        header .title small { color: var(--muted); font-size: 12px; }
        header button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: var(--text);
        }
        header button:hover { background: var(--surface-variant); }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .empty {
            margin: auto;
            text-align: center;
            color: var(--muted);
            max-width: 280px;
        }
        .empty h2 { color: var(--text); font-size: 22px; margin: 0 0 8px; }
        .bubble {
            max-width: 88%;
            padding: 12px 14px;
            border-radius: 18px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .bubble.user {
            align-self: flex-end;
            background: var(--primary);
            color: var(--on-primary);
            border-bottom-right-radius: 4px;
        }
        .bubble.assistant {
            align-self: flex-start;
            background: var(--surface-variant);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .trace {
            background: var(--surface);
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .trace .step { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .trace .step:last-child { margin-bottom: 0; }
        .trace .step .role { font-weight: 600; color: var(--text); display: block; margin-bottom: 2px; }
        .banner {
            position: sticky;
            bottom: 8px;
            align-self: center;
            background: var(--surface-variant);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid transparent;
            border-top-color: var(--primary);
            border-right-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            resize: none;
            font: inherit;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px 14px;
            background: var(--surface);
            min-height: 40px;
            max-height: 120px;
            outline: none;
            color: var(--text);
        }
        textarea:focus { border-color: var(--primary); }
        .send {
            border: none;
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s;
        }
        .send:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 10;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
        }
        .modal h3 { margin: 0 0 6px; font-size: 18px; }
        .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
        .modal input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font: inherit;
            outline: none;
        }
        .modal input:focus { border-color: var(--primary); }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }
        .modal-actions button {
            border: none;
            background: transparent;
            color: var(--primary);
            font: inherit;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .modal-actions button:hover { background: var(--surface-variant); }
        .badge {
            font-size: 10px;
            background: var(--surface-variant);
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
        }
        .err {
            background: #fee;
            color: #b00020;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin: 8px 18px 0;
        }
    </style>
</head>
<body>
    <div class="phone" id="app">
        <header>
            <div class="title">
                <h1>Nova <span class="badge">web demo</span></h1>
                <small>multi-agent assistant</small>
            </div>
            <button id="settings-btn" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </header>
        <div class="err" id="err" style="display:none"></div>
        <main id="main">
            <div class="empty" id="empty">
                <h2>Ask Nova anything</h2>
                <p>Three small agents (Researcher → Analyzer → Writer) collaborate behind every reply.</p>
            </div>
        </main>
        <footer>
            <textarea id="input" placeholder="Tanya apa pun…" rows="1"></textarea>
            <button class="send" id="send" title="Send" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </footer>
    </div>

    <div class="modal-backdrop" id="modal">
        <div class="modal">
            <h3>Anthropic API key</h3>
            <p>Get a key from console.anthropic.com. It's stored only in your browser (localStorage).</p>
            <input type="password" id="key-input" placeholder="sk-ant-…" autocomplete="off" />
            <div class="modal-actions">
                <button id="cancel">Cancel</button>
                <button id="save">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
